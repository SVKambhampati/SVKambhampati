<svg xmlns="http://www.w3.org/2000/svg" width="433" height="120" viewBox="0 0 433 120" role="img" aria-label="sentimentsignal: Stock sentiment intelligence platform."><title>sentimentsignal: Stock sentiment intelligence platform.</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(60px) rotate(-6deg)}65%{opacity:1;transform:translateY(-6px) rotate(1.5deg)}100%{transform:none}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
@keyframes nudge{0%,80%,100%{transform:none}90%{transform:translateX(4px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out both}
.swing{transform-box:fill-box;transform-origin:center bottom;animation:swing 1s cubic-bezier(.2,.8,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.nudge{animation:nudge 3s ease-in-out infinite}
.blink{animation:blink 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g class="rise" style="animation-delay:0.10s"><rect x="1" y="1" width="431" height="118" rx="16" fill="#faf7f0" stroke="#e6e0d3" stroke-width="1.5"/><clipPath id="rc"><rect x="1" y="1" width="431" height="118" rx="16"/></clipPath><rect x="1" y="1" width="7" height="118" fill="#f2a900" clip-path="url(#rc)"/><text x="30" y="44" class="serif" font-size="24" fill="#1b1a17">sentimentsignal</text><g class="nudge"><text x="403" y="44" text-anchor="end" class="sans" font-size="20" fill="#f2a900">→</text></g><text x="30" y="72" class="sans" font-size="13.5" fill="#6f6a60">Stock sentiment intelligence platform.</text><circle cx="36" cy="96" r="5" fill="#3178c6"/><text x="48" y="100" class="mono" font-size="11.5" fill="#6f6a60">TypeScript</text></g></svg>