-anchor="middle" class="mono" font-size="11" fill="#6f6a60">Jun</text><rect x="517.6" y="197.0" width="46" height="3.0" rx="6" fill="#e6e0d3" class="grow" style="animation-delay:0.72s"/><text x="540.6" y="222" text-anchor="middle" class="mono" font-size="11" fill="#6f6a60">Jul</text><rect x="584.7" y="182.8" width="46" height="17.2" rx="6" fill="#c9c1b1" class="grow" style="animation-delay:0.78s"/><text x="607.7" y="222" text-anchor="middle" class="mono" font-size="11" fill="#6f6a60">Aug</text><rect x="651.8" y="197.0" width="46" height="3.0" rx="6" fill="#e6e0d3" class="grow" style="animation-delay:0.84s"/><text x="674.8" y="222" text-anchor="middle" class="mono" font-size="11" fill="#6f6a60">Sep</text><rect x="718.9" y="168.5" width="46" height="31.5" rx="6" fill="#c9c1b1" class="grow" style="animation-delay:0.90s"/><text x="741.9" y="222" text-anchor="middle" class="mono" font-size="11" fill="#6f6a60">Oct</text><rect x="786.0" y="197.0" width="46" height="3.0" rx="6" fill="#e6e0d3" class="grow" style="animation-delay:0.96s"/><text x="809.0" y="222" text-anchor="middle" class="mono" font-size="11" fill="#6f6a60">Nov</text></svg>