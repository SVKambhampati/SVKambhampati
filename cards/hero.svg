="12.5" fill="#cfc8b8" style="animation-delay:1.74s"><tspan fill="#7d7768">> </tspan>cloud platforms</text><text x="558" y="182" class="mono fade" font-size="12.5" fill="#cfc8b8" style="animation-delay:2.02s"><tspan fill="#7d7768">> </tspan>security</text><text x="558" y="202" class="mono fade" font-size="12.5" fill="#f2a900" style="animation-delay:2.30s"><tspan fill="#7d7768">$ </tspan>open svk-eta.vercel.app</text><rect x="748" y="191" width="8" height="14" fill="#f2a900" class="blink" style="animation-delay:2.58s"/></svg>